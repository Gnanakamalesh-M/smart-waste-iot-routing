name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # mypy type-checks the lazy `import sklearn` lines inside src/smartwaste/ml, so the types
      # job needs the ml extra even though the test chunks mostly do not. Phase 4 adds the same
      # requirement for the `roads` extra: without it installed, mypy fails on the lazy
      # `from ortools... import` / `import osmnx` lines in src/smartwaste/routing, which is
      # exactly how the Phase 3 types job broke.
      - run: pip install -e ".[dev,ml,roads]"
      - run: python -m mypy

  tests:
    name: pytest (${{ matrix.chunk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [unit, sim, ml, routing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # One extra per chunk, and no chunk gets an extra it is not supposed to need:
      #
      #   ml      -> .[dev,ml]     scikit-learn, for the forecasting / anomaly models
      #   routing -> .[dev,roads]  ortools + osmnx + networkx, for the Phase 4 VRP and roads
      #   others  -> .[dev]        stdlib + pyyaml only
      #
      # That is what the lazy imports in src/smartwaste/ml and src/smartwaste/routing exist for:
      # if a unit / sim / slow test ever imports one of these wheels, this job fails rather than
      # passing quietly on a machine that happens to have it installed. The `routing` chunk's
      # ortools/osmnx tests are additionally guarded with `pytest.importorskip`, so that chunk is
      # green both here (tests run) and on a machine without the extra (tests skip) -- verified
      # locally by uninstalling, see docs/PHASE4_RESULTS.md.
      - name: install (one extra per chunk)
        shell: bash
        run: |
          case "${{ matrix.chunk }}" in
            ml)      pip install -e ".[dev,ml]" ;;
            routing) pip install -e ".[dev,roads]" ;;
            *)       pip install -e ".[dev]" ;;
          esac
      - name: marker '${{ matrix.chunk }}' is registered
        shell: bash
        # pytest's --strict-markers rejects unregistered markers on tests, but NOT in a -m
        # expression: a typo'd chunk name would just deselect everything and exit 5, which the
        # next step tolerates. So fail loudly here if the marker is not declared in pyproject.
        run: |
          if ! python -m pytest --markers | grep -q "^@pytest\.mark\.${{ matrix.chunk }}:"; then
            echo "marker '${{ matrix.chunk }}' is not registered in pyproject.toml"
            exit 1
          fi

      - name: pytest -m ${{ matrix.chunk }}
        shell: bash
        # Exit code 5 means "no tests collected": a chunk whose phase has not landed yet.
        # Every other non-zero code (1 = failures, 2 = collection error, 3 = internal,
        # 4 = usage) still fails the job, so this tolerates emptiness without weakening tests.
        run: |
          set +e
          python -m pytest -m "${{ matrix.chunk }}"
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "no tests collected for marker '${{ matrix.chunk }}' yet"
            exit 0
          fi
          exit "$code"

  slow:
    name: pytest (slow)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # Deliberately WITHOUT the ml and roads extras: the slow chunk must not need scikit-learn,
      # ortools or osmnx either.
      - run: pip install -e ".[dev]"
      - name: marker 'slow' is registered
        shell: bash
        run: |
          if ! python -m pytest --markers | grep -q "^@pytest\.mark\.slow:"; then
            echo "marker 'slow' is not registered in pyproject.toml"
            exit 1
          fi

      - name: pytest -m slow
        shell: bash
        run: |
          set +e
          python -m pytest -m slow
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "no tests collected for marker 'slow' yet"
            exit 0
          fi
          exit "$code"
