# ALL tunable assumptions for this project live here.
#
# STATUS: every value below is a PLACEHOLDER as of Phase 0. Nothing has been simulated,
# measured or validated yet. Sources are marked as:
#   paper   - stated in the IEEE paper we extend
#   chosen  - picked by us because the paper does not state it
#   derived - computed from other values
# See docs/ASSUMPTIONS.md for the per-parameter record.

seed: 42                        # chosen: one global seed; same command + same seed = same numbers

bin:
  height_cm: 100.0              # chosen: inner height H used in phi = 1 - d_bar / H
  w_max_kg: 50.0                # chosen: bin weight capacity W_max
  alpha: 0.85                   # chosen: paper defines W_th = alpha * W_max but never gives alpha
  yellow_threshold_pct: 60.0    # paper: YELLOW when 60 <= Fv < 80 and load-cell flag is 0
  red_threshold_pct: 80.0       # paper: RED when Fv >= 80 or load-cell flag is 1
  density_kg_per_pct: 0.5       # chosen: kg of waste per 1% of bin volume (= w_max_kg / 100)
  density_cv: 0.3               # chosen: per-bin spread of that density; 0 makes the load cell useless
  max_accumulated_weight_kg: 100.0  # invented, uncited: physical cap on an uncollected bin's weight.
                                #   Must be >= alpha * w_max_kg or a missed bin could never raise
                                #   the load-cell flag. No field data; see docs/ASSUMPTIONS.md.

sensors:
  n_ultrasonic: 3               # paper: 3 ultrasonic sensors (left / center / right)
  noise_sigma_cm: 1.5           # chosen: Gaussian measurement noise per ultrasonic reading
  bias_max_cm: 3.0              # chosen: max absolute constant per-sensor bias
  stuck_probability: 0.01       # chosen: per-reading chance a sensor repeats its last value
  uneven_fill_skew_cm: 10.0     # chosen: max lateral height difference across the 3 sensors
  min_distance_cm: 2.0          # chosen: HC-SR04 minimum range; readings clamp here on a full bin
  load_cell_sigma_kg: 0.3       # chosen: Gaussian load-cell noise (paper reports none)
  load_cell_bias_max_kg: 0.5    # chosen: max absolute constant load-cell miscalibration
  stuck_bin_fraction: 0.02      # invented, uncited: fraction of city bins with one stuck sensor.
                                #   Which of the 3 sensors is stuck is drawn uniformly, so neither
                                #   the mean nor the median fusion rule is favoured by construction.

fusion_eval:
  n_bins: 200                   # chosen: independent bins simulated per noise scenario
  days: 30                      # chosen: days per bin (matches the paper's 30-day horizon)
  sweep_samples: 20000          # chosen: samples in the diagnostic uniform-fill sweep
  bootstrap_resamples: 2000     # chosen: bin-level bootstrap resamples for the 95% CIs

sim:
  n_bins: 5000                  # paper: 5000 bins in the city-scale simulation
  days: 30                      # paper: 30-day horizon (the paper also says "three-month"; we use 30)
  grid_km: 100.0                # paper: bins placed on a 100 x 100 km grid
  daily_fill_mean_kg: 4.0       # chosen: mean of the daily increment dW_i(t)
  daily_fill_sd_kg: 1.5         # chosen: standard deviation of the daily increment

demand:
  # PHASE 3. Every value in this section is INVENTED AND UNCITED. The paper says only that daily
  # increments are "random" - no distribution, no heterogeneity, no calendar. Nothing here has a
  # citation or a measurement behind it, and nothing here was tuned after seeing a result.
  #
  # Phase 2 found a plain every-3-days calendar matched the paper's sensors because its arrivals
  # were smooth i.i.d. Gaussian. This section makes demand actually vary, so that finding can be
  # retested. Results depending on it hold ON THIS INVENTED DEMAND ONLY.
  scenario: heterogeneous       # invented: "smooth" reproduces Phase 2 exactly; "heterogeneous"
                                #   is the Phase 3 process. The benchmark reports BOTH.
  area_type_weights: [0.2, 0.5, 0.3]
                                # invented, uncited: share of bins that are market / residential
                                #   / apartment. Must sum to 1.0.
  area_mean_kg: [6.0, 2.0, 3.4]
                                # invented, uncited: mean daily arrival per area type.
                                #   DELIBERATELY SCALED so the long-run mean per bin lands near
                                #   sim.daily_fill_mean_kg (4.0) AFTER the weekday mean (1.1143)
                                #   and the festival factor (1.1000) are applied: 3.22 * 1.2257 =
                                #   3.947, i.e. -1.3%. Without this the heterogeneous city would
                                #   simply make more waste than the smooth one and every Phase 3
                                #   number would improve for the wrong reason. tests/test_demand.py
                                #   MEASURES the realised mean and pins it within 5%.
  cv: 0.35                      # invented, uncited: per-bin-day coefficient of variation.
                                #   sd = mean * cv, so spread scales with the mean (a market bin
                                #   is noisy in kg, a residential one is not).
  weekday_multipliers: [1.0, 1.0, 1.0, 1.0, 1.15, 1.4, 1.25]
                                # invented, uncited: Mon..Sun. Day 0 of the horizon is a Monday.
  festival_days_per_month: 2    # invented, uncited: quoted per 30 days.
  festival_multiplier: 2.5      # invented, uncited: arrival multiplier on a festival day.

forecast:
  # PHASE 3. Every value in this section is INVENTED AND UNCITED, and none was adjusted after
  # seeing a model's score. In particular warmup_days stays at 14 even though that gives the
  # gradient-boosting model very little seasonality to learn from - that is reported as a
  # limitation, not tuned away.
  warmup_days: 14               # invented, uncited: days 0..13 run the backstop schedule only and
                                #   log noisy estimates; the model is fitted once at day 14 and
                                #   frozen. This is the TIME-BASED split - never a random one.
  horizon_days: 3               # invented, uncited: how many days ahead a forecast looks.
  history_days: 5               # invented, uncited: lags of Fv-hat and weight used as features.
                                #   Must be <= warmup_days or no training row could be built.
  moving_average_window: 3      # invented, uncited: window for the moving-average BASELINE.
  backstop_days: [3.0, 7.0]     # invented, uncited: the "next scheduled visit" each
                                #   forecast-driven strategy falls back on. Both are run, each
                                #   compared against the sensor-free calendar of the SAME period,
                                #   so a win cannot just be a shorter schedule.
  gbm_max_iter: 200             # invented, uncited: HistGradientBoostingRegressor n iterations.
  gbm_learning_rate: 0.1        # invented, uncited.
  gbm_max_depth: 4              # invented, uncited.

anomaly:
  # PHASE 3. Every value in this section is INVENTED AND UNCITED.
  n_bins: 400                   # invented, uncited: bins in the planted-fault dataset.
  days: 60                      # invented, uncited: days per bin.
  fault_bin_fraction: 0.15      # invented, uncited: share of bins given a planted fault.
  window_days: 5                # invented, uncited: rolling window the detectors score over.
  validation_seed_offset: 1     # invented: thresholds are chosen on seed+offset and applied
                                #   unchanged to the scoring seed. Choosing them on the scoring
                                #   seed's planted labels would be leakage.
  min_fault_days: 6             # invented, uncited: shortest planted fault episode.
  max_fault_days: 20            # invented, uncited: longest planted fault episode.
  drift_cm_per_day: 1.2         # invented, uncited: cm per day a drifting sensor wanders.
  noise_burst_sigma_cm: 12.0    # invented, uncited: extra Gaussian sigma during a noise burst.
  stuck_tolerance_cm: 0.05      # invented, uncited: rule baseline's "no variance" tolerance.
  disagreement_cm: 25.0         # invented, uncited: rule baseline's 3-sensor disagreement limit.
  contamination: 0.15           # invented, uncited: IsolationForest expected outlier share.
  n_estimators: 200             # invented, uncited: IsolationForest trees.

cost:
  fuel_l_per_km: 0.35           # chosen: truck fuel consumption, the 'a' in F = a * D
  fuel_cost_per_l: 95.0         # chosen: diesel price (INR per litre)
  co2_kg_per_l: 2.68            # chosen: CO2 emitted per litre of diesel, the 'b' in E = b * D
  maintenance_cost_per_km: 8.0  # chosen: maintenance cost per km (INR)
  labor_cost_per_hr: 180.0      # chosen: crew cost per truck-hour (INR)
  fixed_cost_per_day: 2000.0    # chosen: fixed cost per truck per day (INR)
  truck_speed_kmph: 25.0        # chosen: average urban collection speed
  service_time_min_per_bin: 3.0 # chosen: time spent emptying one bin
  truck_capacity_kg: 8000.0     # chosen: payload capacity, used from Phase 4 (VRP)

routing:
  n_clusters: 20                # chosen: KMeans geographic clusters (one truck tour per cluster)
  n_trucks_per_cluster: 1       # chosen: Phase 2 uses one truck per cluster; VRP relaxes this
  two_opt_max_iters: 1000       # chosen: iteration cap for the 2-opt TSP improvement pass

benchmark:
  fixed_schedule_days: 3        # chosen: N in strategy (b), "collect every bin every N days"
  n_seeds: 5                    # chosen: seeds 42..46; reported as a RANGE over seeds, not a CI
  fault_fractions: [0.0, 0.02, 0.10]
                                # chosen: the stuck-sensor sweep. 0.0 = no faults, 0.02 matches
                                #   sensors.stuck_bin_fraction, 0.10 is the sensitivity row. All
                                #   three are reported so the mean-vs-median verdict does not rest
                                #   on one invented number.

paths:
  data_dir: data              # inputs and generated datasets (gitignored)
  cache_dir: cache              # downloaded artifacts, e.g. OSMnx road graphs (gitignored)
  results_dir: results          # benchmark tables and figures (gitignored)
