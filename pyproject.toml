[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartwaste"
version = "0.0.0"
description = "Smart waste collection: IoT sensor fusion, forecasting and route optimization"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
# Added in later phases; Phase 0 deliberately installs none of these.
sim = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
# Phase 3's optional extra, and the ONLY extra any Phase 3 code needs.
#
# SPEC section 5 lists xgboost ("XGBoost first"). Phase 3 uses scikit-learn's
# HistGradientBoostingRegressor instead: the same model family, one fewer heavy wheel, and one
# library to pin rather than two. The substitution is recorded in docs/ASSUMPTIONS.md.
#
# scikit-learn is imported LAZILY, inside the functions that fit a model, so the naive forecast
# baselines, the rule-based anomaly detector, the demand model and the moving-average
# forecast-driven strategies all run without this extra installed. Only the `ml` pytest chunk
# requires it; unit / sim / routing / slow must stay green without it.
ml = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
]
# Phase 4's optional extra, and the ONLY extra any Phase 4 code needs.
#
# Named `roads` rather than `routing`, deliberately: `routing` is also a pytest marker, and that
# chunk must stay installable from `[dev]` alone. Two different things called "routing" in the
# same CI file is how a chunk quietly starts depending on a wheel it is supposed to prove it does
# not need.
#
# All three are imported LAZILY, inside the functions that need them, so the stdlib routing
# (nearest neighbour, 2-opt, the capacity executor, the bbox and detour-ratio maths) all runs
# without this extra installed. The unit / sim / routing / slow chunks must stay green without
# it; every test that touches ortools, osmnx or networkx is guarded with `pytest.importorskip`.
roads = [
    "ortools>=9.10",
    "networkx>=3.3",
    "osmnx>=1.9",
]
# Phase 5's optional extra, and the ONLY extra any Phase 5 code needs. Declared back in Phase 0
# and unused until now, so Phase 5 documents it rather than inventing a second extra that would
# install the same two wheels.
#
# Both are DASHBOARD-ONLY. `src/smartwaste/dashboard_data.py` -- which is all the dashboard reads
# through -- is stdlib only, `plotly` is imported LAZILY inside each figure function in
# `dashboard/app.py`, and `streamlit` is imported only by `dashboard/app.py` itself, which
# nothing but streamlit and its AppTest harness ever imports. So the unit / sim / ml / routing /
# slow chunks must stay green with this extra UNINSTALLED; only the `dash` chunk needs it, and
# its one test is guarded with `pytest.importorskip`. Verified by actually uninstalling both --
# see docs/PHASE5_RESULTS.md.
app = [
    "streamlit>=1.37",
    "plotly>=5.23",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", "tools", "dashboard"]
warn_unused_ignores = true
no_implicit_optional = true

# scikit-learn ships no py.typed marker, so even with the `ml` extra installed mypy cannot
# resolve it and strict mode fails on the import. Narrowed to sklearn alone: every other import
# in this project is still type-checked normally, and the two call sites that touch an sklearn
# estimator keep their own local ignores.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

# Same situation for the Phase 4 `roads` extra: ortools ships no usable stubs for the routing
# solver, and osmnx / networkx are untyped from strict mode's point of view. The CI `types` job
# installs `.[dev,ml,roads]` so these imports resolve at all; without the install, mypy fails on
# the import lines themselves rather than on anything we wrote.
[[tool.mypy.overrides]]
module = ["ortools.*", "osmnx.*", "networkx.*"]
ignore_missing_imports = true

# Same situation again for the Phase 5 `app` extra: streamlit ships a py.typed marker but plotly
# does not, and neither resolves at all unless the extra is installed. The CI `types` job
# installs `.[dev,ml,roads,app]` so these imports resolve -- without it, mypy fails on the
# `import streamlit` line in dashboard/app.py rather than on anything we wrote. That is exactly
# how the Phase 3 types job broke, and then the Phase 4 one.
[[tool.mypy.overrides]]
module = ["streamlit.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, isolated tests with no simulation or model training",
    "sim: bin / city simulation tests",
    "ml: forecasting and anomaly-detection model tests",
    "routing: clustering, TSP and VRP tests",
    "slow: long-running tests, excluded from the default chunks",
    "dash: streamlit dashboard smoke tests (needs the app extra)",
]
